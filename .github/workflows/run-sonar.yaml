name: '- helper (sonar)'
on: workflow_call
jobs:
  run-sonar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag_name }}

      - name: Get Project LCOV
        uses: actions/download-artifact@master
        with:
          name: appLcov
          path: ./lcov.info

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.METIS_FRONTEND_SONAR_TOKEN }}
        with:
          args:
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=europeana
            -Dsonar.projectKey=europeana_metis-ui-maintenance-utils
            -Dsonar.test.inclusions=**/*.spec.ts
            -Dsonar.exclusions=**/_mocked/**
            -Dsonar.javascript.lcov.reportPaths=./lcov.info/lcov.info
